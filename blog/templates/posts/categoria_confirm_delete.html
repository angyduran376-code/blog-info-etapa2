{% extends 'base.html' %}   

{% load static %}



{% block contenido %}
<center>
<div class ="container-fluid" style="margin: 200px;">
    <h1>Eliminar categoria</h1>
    <p>¿Estás seguro de que deseas eliminar la categoría "{{ object.nombre }}"?</p>
    <br>
    <form method="post">
        {% csrf_token %}
        <input type="submit" value="Confirmar eliminación"> 
        <a style="color:black" href="{% url 'apps.posts:categoria_list' %}">No, Cancelar</a>
    </form>
    
</div>
</center>
{%endblock%}
