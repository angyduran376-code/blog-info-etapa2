{% extends 'base.html' %}

{% load static %}

{% block contenido%}

<center>
    <div class="coneiner-fluid" style="margin: 30px">
        <a id="boton_post"
              href="{% url 'apps.posts:crear_categoria' %}?next={%url 'apps.posts:post_update' pk=object.id %}">
                   Crear Nueva Categoria
        </a>
    <br>
    <h1>Modificar Post</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Guardar Cambios">
    </form>
    </div>
</center>
{% endblock %}
