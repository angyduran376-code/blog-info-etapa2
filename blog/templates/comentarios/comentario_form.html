{% extends 'base.html' %}

{% load static %}

{% block contenido %}
<center>
    {%if user.is_authenticated or comentario.usuario == user %}
    <div class="container-fluid" style="margin: 300px">
        <h1>Editar Comentario</h1>
        <form method="POST" style="margin-bottom: 10px; margin-top: 100px;">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" class="btn btn-primary" value="Guardar Cambios">
            <a class="btn btn-secondary" href="javascript:history.back()">Cancelar</a>
        </form>
    </div>
    {% else %}
     <div class="container-fluid" style="margin: 300px">
        <h1>Solo los usuarios con permisos pueden acceder a esta página</h1>
    </div>
    {% endif %}
</center>
{%endblock contenido%}
