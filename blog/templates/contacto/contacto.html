{% extends 'base.html' %}
{% load static %}

{% block contacto %}
<center>
    <form method="POST" style="margin: 200px;">
        <h1>Formulario de Contacto</h1>
        <br>
        {% if messages %}
            {% for message in messages  %}
                <div class='message{{message.tags}}'>{{message}}</div>
            {% endfor %}
        {% endif %}
        <table>
            {% csrf_token %}
            {{ form }}
        </table>
        <input type="submit" value="Enviar">
    </form>
</center>

{% endblock contacto %}
