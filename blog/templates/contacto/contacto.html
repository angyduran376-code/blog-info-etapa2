{% extends "base.html" %}

{% load static %}

{% block contenido %}

<center>
    <form method="POST" style="margin:100px;">
        {% csrf_token %}
        <h1>Formulario de Contacto</h1>
        <br>
        {% if messages %}
            {% for message in messages %}
                <div class="message {{message.tags}}">{{message}}</div>
            {% endfor %}
        {% endif %}
        <table>
            {% csrf_token %}
            {{form}}            
        </table>
        <input type="submit" value="Enviar Consulta" class="btn btn-primary">
    </form>    
</center>

{% endblock %}
