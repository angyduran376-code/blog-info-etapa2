{% extends "bases.html" %}

{% load static %}

<title>{% block title %}Login de Usuario{% endblock %}</title>

{% block contenido %}
<center>

  <form method="POST", enctype="multipart/form-data" style="margin-top: 300px; margin-bottom: 100px;">
        <h1 class="h1">Iniciar Sesión</h1>
        <br>
        <div class="messages">
            {% for message in messages %}
                <table {% if message.tags %} class="{{ message.tags }}"{% endif %}> 
                    {{ message }}
                </table>
            {% endfor %}
        </div>
        <br>
            {% csrf_token %}
        <div class="container-fluid">
            <table>
                {{ form }}
            </table>
            <br>
            <a style="color: black;"  href="{% url 'apps.usuario.registrar' %}">¿No tienes una cuenta? Regístrate aquí</a>
            <br><br>
            <button type="submit" class="btn btn-success btn-lg px-3">Iniciar Sesión</button>
        </div>
  </form>
</center>
{% endblock %}
